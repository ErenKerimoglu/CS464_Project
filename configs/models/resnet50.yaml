# ImageNet-pretrained resnet50 (#12), full fine-tuning recipe of PROJECT_PLAN §3.2. Tuned values land in
# configs/experiments/model_family/resnet50.yaml (#15). Inputs use our per-band stats, not ImageNet mean/std.
defaults: [base.yaml]
model: {name: resnet50, pretrained: true}
preprocess: {policy: rotflip, out_size: 224}
train: {max_epochs: 30, lr: 1.0e-4}
